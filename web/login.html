<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Sign in to manage your MedVerify NG API key." />
    <title>Sign in · MedVerify NG</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script type="module" src="assets/auth.js"></script>
  </head>
  <body data-page="login">
    <a class="skip-link" href="#main">Skip to the sign-in form</a>

    <div class="app account">
      <header class="site-header">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.4 5.2 5.9v5.3c0 4.2 2.8 7.6 6.8 9 4-1.4 6.8-4.8 6.8-9V5.9z" />
              <path d="m9.1 11.9 2 2 3.8-4.2" />
            </svg>
          </span>
          <div class="brand-text">
            <h1>MedVerify NG</h1>
            <p class="tagline">Account</p>
          </div>
        </a>
        <nav class="account-nav" aria-label="Account">
          <a class="pill-link" href="/register">Create account</a>
        </nav>
      </header>

      <main id="main" class="account-main">
        <section class="account-card" aria-labelledby="signin-title">
          <p class="eyebrow">Account</p>
          <h2 id="signin-title">Sign in</h2>
          <p class="hint">
            Use the email address and password you registered with. Your API key
            lives on the settings page.
          </p>

          <form id="login-form" data-account-form="login" novalidate>
            <div class="field">
              <label for="email">Email address</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="username"
                inputmode="email"
                autocapitalize="none"
                spellcheck="false"
                required
              />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>

            <p id="form-error" class="form-error" role="alert" hidden></p>

            <button id="submit" class="btn primary" type="submit">Sign in</button>
          </form>

          <p class="hint">
            No account yet? <a href="/register">Register to get an API key</a>.
          </p>
        </section>
      </main>
    </div>

    <noscript>
      <p class="noscript">Signing in needs JavaScript. Enable it and reload this page.</p>
    </noscript>
  </body>
</html>
