version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/platform/db/queries"
    gen:
      go:
        package: "dbgen"
        out: "internal/platform/db/dbgen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        # Nullable columns map to pointers instead of pgtype wrappers. The
        # registry has many nullable free-text fields, and pointers keep the
        # domain layer readable.
        overrides:
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.float8"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
