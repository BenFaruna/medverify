version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - noctx
    - unconvert
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    rules:
      # Test files may ignore errors in cleanup helpers.
      - path: _test\.go
        linters:
          - errcheck
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
