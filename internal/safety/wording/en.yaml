version: wording-v1
language: en

templates:
  watchlist_alert: "This product appears in a {issuing_body} alert dated {issued_at}. Source: {source_url}"
  watchlist_withdrawal: "This product appears in a {issuing_body} withdrawal notice dated {issued_at}. Source: {source_url}"
  watchlist_banned_ingredient: "The ingredient {ingredient} appears on a {issuing_body} list of banned ingredients. Source: {source_url}"
  watchlist_restricted_ingredient: "The ingredient {ingredient} appears on a {issuing_body} list of restricted ingredients. Source: {source_url}"
  undeclared_ingredient: "The label lists {ingredient}, which is not in the registered record."
  missing_ingredient: "The registered record lists {ingredient}, which this label does not show."
  strength_deviation: "The printed strength of {ingredient} is {label_strength}; the registered strength is {registry_strength}."
  registry_expired: "NAFDAC records show this registration as expired."
  registry_withdrawn: "NAFDAC records show this registration as withdrawn."
  registry_inactive: "NAFDAC records show this registration as inactive."
