name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with go.mod and the Dockerfile.
  GO_VERSION: "1.26.x"
  GOLANGCI_LINT_VERSION: "v2.6.2"
  # Pinned so a new gitleaks release cannot change scan results on its own.
  GITLEAKS_VERSION: "v8.30.1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - name: Check generated sqlc code is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          sqlc generate
          git diff --exit-code -- internal/platform/db/dbgen

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          golangci-lint run

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - run: go vet -tags=integration ./...

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Generous but finite: a wedged container start must not hold a runner for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Testcontainers starts its own pgvector Postgres and S3 store per package,
      # so every run gets a clean database. The runner provides Docker.
      - name: Pre-pull images used by testcontainers
        run: |
          docker pull pgvector/pgvector:pg16
          docker pull chrislusf/seaweedfs:latest
          docker pull testcontainers/ryuk:0.14.0
      - name: Integration tests
        shell: bash
        run: |
          set -o pipefail
          # Each package starts its own Postgres, S3 store and reaper, so running
          # every package at once starves container startup on a 4-vCPU runner.
          # The 10m default timeout is per package and too tight under -race;
          # keep the log so a timeout shows which test was in flight.
          go test -race -tags=integration -count=1 -timeout 20m -p 2 -v ./... 2>&1 \
            | tee integration-tests.log
      - name: Upload integration test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-log
          path: integration-tests.log
          retention-days: 7

  vulnerability-scan:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}
          # Test fixtures and documented placeholder keys are allowlisted in
          # .gitleaks.toml; everything else must be clean.
          gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --exit-code 1
