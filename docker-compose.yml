name: medverify

# Local development stack. Values come from .env (see .env.example); the
# defaults below work out of the box.
#
# Containers talk to each other on the compose network, so their DATABASE_URL
# and STORAGE_ENDPOINT differ from the ones a process on the host uses.
#
# Object storage is a SeaweedFS S3 gateway because MinIO images are no longer
# publicly pullable. The storage package talks S3, so swapping the provider is a
# configuration change, not a code change.

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_ADDR: ":8080"
  HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-15s}
  HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
  HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-1048576}
  DATABASE_URL: postgres://${POSTGRES_USER:-medverify}:${POSTGRES_PASSWORD:-medverify-local-password}@postgres:5432/${POSTGRES_DB:-medverify}?sslmode=disable
  STORAGE_ENDPOINT: storage:8333
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-medverify-dev}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-medverify-dev-secret}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-medverify}
  JOBS_CONCURRENCY: ${JOBS_CONCURRENCY:-4}
  JOBS_SHUTDOWN_TIMEOUT: ${JOBS_SHUTDOWN_TIMEOUT:-15s}
  API_KEY: ${API_KEY:-dev-api-key}
  SCAN_MAX_IMAGES: ${SCAN_MAX_IMAGES:-4}
  SCAN_MAX_IMAGE_BYTES: ${SCAN_MAX_IMAGE_BYTES:-10485760}
  SCAN_MAX_REQUEST_BYTES: ${SCAN_MAX_REQUEST_BYTES:-47185920}
  SCAN_MAX_PIXELS: ${SCAN_MAX_PIXELS:-40000000}
  SCAN_SYNC_WAIT: ${SCAN_SYNC_WAIT:-5s}
  SCAN_POLL_INTERVAL: ${SCAN_POLL_INTERVAL:-100ms}
  SCAN_MIN_CONFIDENCE: ${SCAN_MIN_CONFIDENCE:-0.5}
  VERIFY_CONFIG_FILE: ${VERIFY_CONFIG_FILE:-}
  SAFETY_CONFIG_FILE: ${SAFETY_CONFIG_FILE:-}
  VERDICT_CONFIG_FILE: ${VERDICT_CONFIG_FILE:-}
  EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-fake}
  EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
  EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
  EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
  EMBEDDINGS_DIMENSION: ${EMBEDDINGS_DIMENSION:-1024}
  EMBEDDINGS_BATCH_SIZE: ${EMBEDDINGS_BATCH_SIZE:-64}
  EMBEDDINGS_TIMEOUT: ${EMBEDDINGS_TIMEOUT:-30s}
  EMBEDDINGS_BACKFILL_LIMIT: ${EMBEDDINGS_BACKFILL_LIMIT:-50}
  EMBEDDINGS_DELAY: ${EMBEDDINGS_DELAY:-0s}
  EMBEDDINGS_INDEX_INTERVAL: ${EMBEDDINGS_INDEX_INTERVAL:-0s}
  VISION_PROVIDER: ${VISION_PROVIDER:-fake}
  VISION_MODEL: ${VISION_MODEL:-claude-sonnet-4-5-20250929}
  VISION_FALLBACK_MODEL: ${VISION_FALLBACK_MODEL:-claude-haiku-4-5-20251001}
  VISION_API_KEY: ${VISION_API_KEY:-}
  VISION_BASE_URL: ${VISION_BASE_URL:-https://api.anthropic.com}
  VISION_MAX_TOKENS: ${VISION_MAX_TOKENS:-4096}
  VISION_TIMEOUT: ${VISION_TIMEOUT:-45s}
  VISION_RETRIES: ${VISION_RETRIES:-2}
  VISION_RETRY_BACKOFF: ${VISION_RETRY_BACKOFF:-500ms}
  VISION_CIRCUIT_FAILURE_THRESHOLD: ${VISION_CIRCUIT_FAILURE_THRESHOLD:-5}
  VISION_CIRCUIT_COOLDOWN: ${VISION_CIRCUIT_COOLDOWN:-30s}
  VISION_MAX_IMAGE_DIMENSION: ${VISION_MAX_IMAGE_DIMENSION:-1568}
  VISION_INPUT_PRICE_PER_MTOKEN: ${VISION_INPUT_PRICE_PER_MTOKEN:-3}
  VISION_OUTPUT_PRICE_PER_MTOKEN: ${VISION_OUTPUT_PRICE_PER_MTOKEN:-15}
  GREENBOOK_ENABLED: ${GREENBOOK_ENABLED:-true}
  GREENBOOK_BASE_URL: ${GREENBOOK_BASE_URL:-https://greenbook.nafdac.gov.ng}
  GREENBOOK_USER_AGENT: ${GREENBOOK_USER_AGENT:-MedVerifyNG/0.1 (+https://github.com/benfaruna/medverify)}
  GREENBOOK_RPS: ${GREENBOOK_RPS:-1}
  GREENBOOK_MAX_CONCURRENCY: ${GREENBOOK_MAX_CONCURRENCY:-2}
  GREENBOOK_PAGE_SIZE: ${GREENBOOK_PAGE_SIZE:-100}
  GREENBOOK_REQUEST_TIMEOUT: ${GREENBOOK_REQUEST_TIMEOUT:-30s}
  GREENBOOK_RETRIES: ${GREENBOOK_RETRIES:-3}
  GREENBOOK_CACHE_DIR: ${GREENBOOK_CACHE_DIR:-/tmp/medverify-greenbook-cache}
  GREENBOOK_CACHE_TTL: ${GREENBOOK_CACHE_TTL:-1h}
  GREENBOOK_MAX_PDF_BYTES: ${GREENBOOK_MAX_PDF_BYTES:-52428800}
  GREENBOOK_MAX_PDF_PAGES: ${GREENBOOK_MAX_PDF_PAGES:-100}
  GREENBOOK_ALLOWED_HOSTS: ${GREENBOOK_ALLOWED_HOSTS:-greenbook.nafdac.gov.ng,admin.greenbook.nafdac.gov.ng}
  GREENBOOK_SYNC_INTERVAL: ${GREENBOOK_SYNC_INTERVAL:-24h}
  GREENBOOK_ANOMALY_MAX_DROP_PERCENT: ${GREENBOOK_ANOMALY_MAX_DROP_PERCENT:-30}
  GREENBOOK_ANOMALY_MAX_PARSE_FAILURE_PERCENT: ${GREENBOOK_ANOMALY_MAX_PARSE_FAILURE_PERCENT:-10}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medverify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medverify-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-medverify}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medverify} -d ${POSTGRES_DB:-medverify}"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -dir=/data
    ports:
      # Host port 9000 keeps the familiar S3 endpoint; the container listens on
      # 8333, which is what STORAGE_ENDPOINT uses inside the compose network.
      - "${STORAGE_PORT:-9000}:8333"
    volumes:
      - storage-data:/data

  # Migrations and bucket creation run once, before api and worker start.
  init:
    build: .
    command:
      - /bin/sh
      - -c
      - |
        until /app/admin migrate up; do echo "waiting for postgres"; sleep 2; done
        until /app/admin storage init; do echo "waiting for object storage"; sleep 2; done
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started

  api:
    build: .
    command: ["/app/api"]
    environment: *app-env
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    build: .
    command: ["/app/worker"]
    environment: *app-env
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  storage-data:
