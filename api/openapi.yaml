openapi: 3.1.0
info:
  title: MedVerify NG API
  version: 0.1.0
  description: |
    MedVerify NG checks a photographed medicine pack against NAFDAC records and
    a curated watchlist, then returns an explainable verdict.

    Every error response uses RFC 7807 problem details with a stable `code`
    field; clients branch on `code`, never on `detail`.

    Programmatic callers authenticate with a per-client API key sent in
    `X-API-Key`. A browser uses the session cookie set by the account routes
    instead, so a page never has to hold a key. Both credentials carry scopes
    and the client's rate limit and daily quotas, all enforced server side.
    Failed attempts are not reported in the body beyond `unauthorized`, so a
    key cannot be probed for.

    The API never declares a medicine safe, genuine, or authentic, never
    describes one as fake, and never returns a numeric score.

    Interactive documentation is served at `/docs`; this document is available
    at `/openapi.yaml`. Both are unauthenticated and expose no scan data.
servers:
  - url: /
    description: The server that served this document
  - url: http://localhost:8080
    description: Local docker compose stack
tags:
  - name: operations
    description: Liveness and readiness probes
  - name: scans
    description: Upload pack photos asynchronously and read the result
  - name: assistant
    description: Ask grounded questions about one scanned pack
  - name: accounts
    description: |
      Create an account, sign in, and manage the API key that programmatic
      clients use. These routes authenticate with a session cookie, never with
      an API key.

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness
      description: |
        Reports that the process is alive. It never checks a dependency, so a
        database outage cannot cause a container restart.
      tags: [operations]
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            RateLimitLimit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimitRemaining:
              $ref: "#/components/headers/RateLimitRemaining"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness
      description: |
        Checks Postgres and object storage. Returns 200 only when every
        dependency responds within the readiness timeout; otherwise 503 with a
        problem detail naming the unavailable dependencies.
      tags: [operations]
      responses:
        "200":
          description: Every dependency is reachable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            RateLimitLimit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimitRemaining:
              $ref: "#/components/headers/RateLimitRemaining"
            Cache-Control:
              description: Always `no-store`; readiness is never cached.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one dependency is unreachable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            RateLimitLimit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimitRemaining:
              $ref: "#/components/headers/RateLimitRemaining"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/scans:
    post:
      operationId: createScan
      summary: Upload one to four pack photos
      description: |
        Accepts a multipart upload, validates and re-encodes each image, stores
        it privately, and starts an asynchronous extraction job. When the job
        finishes within the sync wait, the response is 201. Otherwise it is 202
        with a Location header; poll GET /v1/scans/{id} until the status is
        terminal.

        Coordinates are reduced to a coarse grid cell; raw latitude and
        longitude are never stored or logged. The client filename is never used
        as a storage key.

        Send the same Idempotency-Key and identical body to retry safely. The
        same key with a different body returns 422.
      tags: [scans]
      security:
        - ApiKeyAuth: []
        - SessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Client-generated key, up to 255 characters.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items:
                    type: string
                    format: binary
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  description: Optional, sent with longitude. Reduced to a coarse cell.
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  description: Optional, sent with latitude. Reduced to a coarse cell.
                language:
                  type: string
                  maxLength: 32
                  example: en
                  description: Optional short language tag for the extraction.
      responses:
        "201":
          description: The scan reached a terminal state within the sync wait.
          headers:
            Location:
              description: Canonical URL of the scan.
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            RateLimitLimit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimitRemaining:
              $ref: "#/components/headers/RateLimitRemaining"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "202":
          description: The scan is still queued or processing; poll the Location.
          headers:
            Location:
              description: URL to poll with GET.
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            RateLimitLimit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimitRemaining:
              $ref: "#/components/headers/RateLimitRemaining"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          description: Missing or invalid fields, too many images, or a corrupt image.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "429":
          description: |
            Rate limited, or the daily quota for this key is used up. The
            problem code distinguishes `rate_limited` from `quota_exceeded`.
          headers:
            RetryAfter:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: A file or the whole request is too large.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: A file is not JPEG, PNG, or WebP according to its bytes.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The Idempotency-Key was already used with a different body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/scans/{id}:
    get:
      operationId: getScan
      summary: Read a scan's status and result
      tags: [scans]
      security:
        - ApiKeyAuth: []
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Scan UUID returned by the upload.
          schema:
            type: string
            format: uuid
      responses:
        "429":
          description: |
            The key (or its calling address) is over its rate limit, or the key
            has used its daily quota. The problem code distinguishes
            `rate_limited` from `quota_exceeded`.
          headers:
            RetryAfter:
              $ref: "#/components/headers/RetryAfter"
            RateLimitLimit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimitRemaining:
              $ref: "#/components/headers/RateLimitRemaining"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: Current scan state. Result fields are null until later phases fill them.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            RateLimitLimit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimitRemaining:
              $ref: "#/components/headers/RateLimitRemaining"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          description: The ID is not a UUID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          description: No scan exists with this ID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/scans/{id}/questions:
    post:
      operationId: askScanQuestion
      summary: Ask a grounded question about one scan
      description: |
        Answers only from the NAFDAC registry record, sourced safety flags, and
        leaflet passages stored for this scan. Every factual claim carries a
        numbered citation whose source is returned in `sources`. The question
        text is stored in the transcript for review but is never logged.

        The endpoint never gives medical advice, a diagnosis, or personal
        dosing. Those questions return a fixed refusal template with
        `verified: false` and no sources. If the sources do not contain the
        answer, it returns the fixed not-found template. A model failure returns
        503 with `Retry-After`; it never returns a partial answer.

        A question about the leaflet is answered from the leaflet when one is
        stored and indexed. When it is not, the answer says so, still lists the
        leaflet document in `sources` so the link is available, and queues a
        background download plus indexing, so asking again later can quote it.
        A question that names the leaflet is never answered as unclear, even if
        the intent classifier returns nothing usable.
      tags: [assistant]
      security:
        - ApiKeyAuth: []
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Scan UUID returned by the upload.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              additionalProperties: false
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: Free text question about this pack.
      responses:
        "200":
          description: |
            A verified, cited answer, a fixed refusal, or a fixed fallback.
            Check `verified` and `fallback`; do not treat fixed text as grounded.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            RateLimitLimit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimitRemaining:
              $ref: "#/components/headers/RateLimitRemaining"
            Cache-Control:
              description: Always `no-store`; answers are per conversation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantAnswer"
        "400":
          description: The ID is not a UUID, or the body is not a JSON question.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          description: No scan exists with this ID for this API client.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The scan has not finished and cannot answer questions yet.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: The conversation expired or was removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The question is empty or longer than the configured limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: |
            One of three limits: the key (or its calling address) is over its
            rate limit, the key has used its daily quota, or this conversation
            has reached its turn limit. The problem code distinguishes
            `rate_limited` from `quota_exceeded`.
          headers:
            RetryAfter:
              $ref: "#/components/headers/RetryAfter"
            RateLimitLimit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimitRemaining:
              $ref: "#/components/headers/RateLimitRemaining"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The assistant provider is temporarily unavailable.
          headers:
            Retry-After:
              description: Suggested retry delay in seconds.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/scans/{id}/conversation:
    get:
      operationId: getScanConversation
      summary: Read the stored question transcript for a scan
      description: |
        Returns the stored turns for this scan's conversation. The transcript is
        scoped to the scan and the API client. It contains the user's question
        text, so the response is never cached.
      tags: [assistant]
      security:
        - ApiKeyAuth: []
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Scan UUID returned by the upload.
          schema:
            type: string
            format: uuid
      responses:
        "429":
          description: |
            The key (or its calling address) is over its rate limit, or the key
            has used its daily quota. The problem code distinguishes
            `rate_limited` from `quota_exceeded`.
          headers:
            RetryAfter:
              $ref: "#/components/headers/RetryAfter"
            RateLimitLimit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimitRemaining:
              $ref: "#/components/headers/RateLimitRemaining"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: The stored conversation.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            RateLimitLimit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimitRemaining:
              $ref: "#/components/headers/RateLimitRemaining"
            Cache-Control:
              description: Always `no-store`; the transcript contains user text.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversation"
        "400":
          description: The ID is not a UUID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          description: No scan exists with this ID for this API client.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: The conversation expired or has not been started.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/auth/register:
    post:
      operationId: registerAccount
      summary: Create an account and its first API key
      description: |
        Creates a client, an account, the first API key, and a signed-in
        session in one transaction. The key is returned in this response and
        nowhere else: only its hash is stored, so it cannot be recovered. The
        session cookie is set on the same response, so the registration form
        can hand the person straight to the chat.

        An account is an API client: the key issued here works on
        `/v1/scans` immediately, with the scopes, rate limit, and daily quotas
        in the response. An address that already has an account receives 409;
        sign in instead.

        This route is deliberately unauthenticated, and is rate limited per
        calling address.
      tags: [accounts]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account, its first key, and a signed-in session.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Cache-Control:
              description: Always `no-store`; the body contains a secret once.
              schema:
                type: string
            Set-Cookie:
              description: |
                The `mv_session` cookie, `HttpOnly`, `SameSite=Lax`, and `Secure`
                over TLS. Its lifetime is the session TTL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: |
            The body is not one JSON object with the expected fields, or a
            field failed validation. `detail` names the field for a person to
            fix.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/CrossSite"
        "409":
          description: That email address already has an account.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://medverify.ng/problems/conflict
                title: Conflict
                status: 409
                detail: That email address already has an account.
                code: conflict
        "413":
          description: The body is larger than the endpoint allows.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/login:
    post:
      operationId: loginAccount
      summary: Sign in and set the session cookie
      description: |
        Verifies the password and sets a fresh `mv_session` cookie. Every
        failure is the same 401: the response never says whether the address
        exists, so accounts cannot be enumerated.

        Signing in does not rotate or reveal the API key. Read it at the
        moment it is created, or rotate it from `/v1/account/api-keys/rotate`.
      tags: [accounts]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; the response sets the session cookie.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Cache-Control:
              description: Always `no-store`; the body is personal data.
              schema:
                type: string
            Set-Cookie:
              description: The `mv_session` cookie for this session.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: The body is not one JSON object with an email and password.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Email or password is incorrect.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://medverify.ng/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: Email or password is incorrect.
                code: unauthorized
        "403":
          $ref: "#/components/responses/CrossSite"
        "413":
          description: The body is larger than the endpoint allows.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/logout:
    post:
      operationId: logoutAccount
      summary: Revoke the session and clear the cookie
      description: |
        Revokes the session row as well as clearing the cookie: clearing alone
        would leave a copied token valid. Signing out without a session is not
        an error, so this returns 204 whether or not a session was present.

        No API key is affected. Code that holds a key keeps working, which is
        the point of keeping the two credentials separate.
      tags: [accounts]
      security: []
      responses:
        "204":
          description: Signed out. The cookie is expired in the same response.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              description: The `mv_session` cookie with an expiry in the past.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/CrossSite"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/account:
    get:
      operationId: getAccount
      summary: Read the signed-in account
      description: |
        Returns the account behind the session cookie. The chat page calls this
        before rendering anything: a 401 means the visitor should be sent to
        `/login`.
      tags: [accounts]
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The signed-in account.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Cache-Control:
              description: Always `no-store`; the body is personal data.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/account/api-keys:
    get:
      operationId: listAPIKeys
      summary: List the account's API keys
      description: |
        Returns every key ever issued to this account, newest first, as
        metadata only. A prefix is the public half of a key: it identifies the
        key for rotation and support without authenticating anything. The
        secret is never included, because only its hash was ever stored.
      tags: [accounts]
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Key metadata, newest first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/account/api-keys/rotate:
    post:
      operationId: rotateAPIKey
      summary: Revoke the active keys and issue a replacement
      description: |
        Revokes every active key on the account and inserts one replacement in
        a single transaction, then returns the new key once. The previous key
        stops working immediately, so rotation after a leak closes the leak.

        The session cookie is unaffected: the browser stays signed in, which is
        what makes rotating from the settings page safe. Update every client
        that holds the old key, because nothing can recover it.
      tags: [accounts]
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The replacement key and how many keys were revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Cache-Control:
              description: Always `no-store`; the body contains a secret once.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Per-client key in the form `mv_<prefix>_<secret>`. The server looks the
        key up by its public prefix and compares a SHA-256 hash of the full
        value in constant time; only the hash is stored. The full key is shown
        once at creation and cannot be recovered.

        A key carries scopes (`scans:write`, `scans:read`,
        `questions:write`). A key without the scope for an endpoint receives
        `403 insufficient_scope`.

        Sandbox keys return fixed responses and never call a provider.

        This is the credential for code the person runs themselves. A browser
        uses `SessionCookie` instead, so the key is never placed in a page.
    SessionCookie:
      type: apiKey
      in: cookie
      name: mv_session
      description: |
        Browser session cookie set by the registration and sign-in responses.
        It is `HttpOnly` and `SameSite=Lax`, so script cannot read it and
        another site cannot send it on a write; the server stores only a hash
        of the token.

        The API accepts it in place of `X-API-Key` for same-origin browser
        calls. A cookie-authenticated write from another origin is refused
        with `403 forbidden`. A session acts with the plan on its client row,
        so it shares that client's rate limit and daily counters with any key
        issued to the same account.

        Do not send this cookie from server-side code: use `ApiKeyAuth` there.
  headers:
    X-Request-Id:
      description: Correlation ID for this request. Echoed from the client when well formed.
      schema:
        type: string
    RateLimitLimit:
      description: Requests per minute allowed for this API key.
      schema:
        type: integer
        example: 60
    RateLimitRemaining:
      description: Whole requests left in the current second-by-second budget.
      schema:
        type: integer
        example: 57
    RetryAfter:
      description: Seconds to wait before retrying. Always present on 429.
      schema:
        type: integer
        minimum: 1
        example: 12
  responses:
    Unauthorized:
      description: |
        No credential was accepted: the `X-API-Key` header is missing,
        unknown, revoked, or expired, and the request carried no valid session
        cookie either.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InsufficientScope:
      description: The key authenticated but does not carry the required scope.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://medverify.ng/problems/insufficient_scope
            title: Forbidden
            status: 403
            detail: The API key does not have permission to perform this action.
            code: insufficient_scope
    CrossSite:
      description: |-
        The request carried the session cookie, but the browser reports it came
        from another site. The check reads the browser's own headers on the
        server, so it does not rely on `SameSite` being honoured. A
        key-authenticated request never gets this answer: a browser cannot set
        `X-API-Key` without an approved CORS preflight.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://medverify.ng/problems/forbidden
            title: Forbidden
            status: 403
            detail: This request came from another site.
            code: forbidden
    RateLimited:
      description: Too many requests for this key or this calling address.
      headers:
        RetryAfter:
          $ref: "#/components/headers/RetryAfter"
        RateLimitLimit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimitRemaining:
          $ref: "#/components/headers/RateLimitRemaining"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://medverify.ng/problems/rate_limited
            title: Too Many Requests
            status: 429
            detail: Too many requests. Retry after the number of seconds in the Retry-After header.
            code: rate_limited
    QuotaExceeded:
      description: The key has used its daily allowance for this kind of request.
      headers:
        RetryAfter:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://medverify.ng/problems/quota_exceeded
            title: Too Many Requests
            status: 429
            detail: The daily scan quota for this API key is used up.
            code: quota_exceeded
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          example:
            database: ok
            storage: ok
    Scan:
      type: object
      required: [id, status, sandbox, verdict, reasons, extracted, flags, disclaimer, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, completed, unreadable, failed]
          description: |
            `unreadable` means the images could not be read confidently; ask
            for a better photo. It never means the medicine is fake.
        sandbox:
          type: boolean
          description: |
            True for a fixed response produced with a sandbox key. No provider
            was called and the result was not derived from the photos. Label it
            in a client instead of presenting it as a real check.
        verdict:
          allOf:
            - $ref: "#/components/schemas/PublicVerdict"
          nullable: true
          description: |
            Deterministic verdict. Null until the scan reaches a terminal state
            or when the worker has no rules file. It carries no numeric score
            and never says a medicine is safe, genuine, or authentic, or that
            one is counterfeit.
        reasons:
          type: array
          description: |
            Reviewed, translatable explanations of the verdict, ordered by
            importance. Empty when there is no verdict, and empty for a reason
            whose wording cannot be completed rather than showing a sentence
            with a gap. Display `text`, not `code`.
          items:
            $ref: "#/components/schemas/VerdictReason"
        extracted:
          allOf:
            - $ref: "#/components/schemas/ExtractedLabel"
          nullable: true
          description: |
            Validated label data. Null until phase 04 fills it and on scans
            that failed before extraction. A missing field is unreadable, not a
            guess. `unreadable` and `conflicts` explain what was not trusted.
        features:
          allOf:
            - $ref: "#/components/schemas/RegistryVerification"
          nullable: true
          description: |
            Registry comparison for the extracted label. Null before phase 05
            ran or when the scan has no result. `dataset` records how much data
            the answer was based on, so `not_found_in_dataset` is never read as
            proof that a pack is fake.
        flags:
          type: array
          description: |
            Sourced safety findings from phase 06. Empty when nothing matched
            and nothing disagreed. A flag cites the document or registry record
            it came from; it is never a safety or authenticity claim.
          items:
            $ref: "#/components/schemas/SafetyFlag"
        disclaimer:
          type: string
          description: |
            Fixed text shown with every result. It states that this tool
            compares packs against NAFDAC records and is not medical advice.
            It is never generated and never varies per result.
          example: "MedVerify compares the pack photo with NAFDAC records. It is not medical advice: talk to a pharmacist or doctor about your medicine."
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
      example:
        id: 0f9d8c2e-6a1f-4c69-9f4d-0f1f6b2c9a11
        status: completed
        sandbox: false
        verdict:
          value: consistent_with_records
          confidence: high
          rules_version: verdict-v1
        reasons:
          - code: label_consistent
            text: The details printed on this pack agree with the NAFDAC record found for it.
        disclaimer: The result compares this pack with NAFDAC records. It does not prove the pack is authentic and it is not medical advice.
        flags: []
        features:
          outcome: matched_consistent
          product:
            source_id: "8875"
            nrn: "04-0858"
            name: 10% Dextrose (500/1000 mL)
            status: Active
            score: 1
          fields:
            nrn: {outcome: agree, label: "04-0858", registry: "04-0858", reasons: [nrn_exact_match]}
            name: {outcome: agree, reasons: [name_match]}
          registry_status: Active
          notes:
            - {code: nrn_exact_match, field: nrn}
          dataset:
            config_version: v1
            products: 198
            last_successful_sync: "2026-11-01T12:00:00Z"
        extracted:
          nrn:
            value: "01-2345"
            confidence: 0.97
            source: 1
          product_name:
            value: "Paracetamol Tablets BP 500 mg"
            confidence: 0.96
            source: 1
          ingredients:
            - name_raw: "Paracetamol"
              name_norm: "paracetamol"
              strength_raw: "500 mg"
              strength: {raw: "500 mg", value: 500, unit: mg}
              confidence: 0.95
              source: 1
          unreadable: []
          conflicts: []
          provider: claude
          model: claude-sonnet-4-5-20250929
          prompt_version: v1
        created_at: "2026-11-02T09:00:00Z"
        completed_at: "2026-11-02T09:00:01Z"
    PublicVerdict:
      type: object
      description: |
        The public verdict. It deliberately has no numeric score: the internal
        concern ranking would read as a probability.
      required: [value, confidence, rules_version]
      properties:
        value:
          type: string
          enum: [consistent_with_records, mismatch_found, not_found_in_records, flagged, needs_review, unreadable]
          description: |
            Closed set. `not_found_in_records` and `mismatch_found` describe
            our reference data, not the physical pack. `unreadable` asks for a
            better photo; it is not a judgement of the medicine.
        confidence:
          type: string
          enum: [low, medium, high]
          description: Coarse certainty band, never a percentage.
        rules_version:
          type: string
          description: Version of the rules file that produced this verdict.
    VerdictReason:
      type: object
      required: [code, text]
      properties:
        code:
          type: string
          description: |
            Stable machine key. Clients may branch on it but must not display
            it: `text` is the reviewed wording.
          example: not_in_dataset
        text:
          type: string
          description: |
            Reviewed wording from the reason catalog, in the scan's language.
            Always display this and never the code.
        field:
          type: string
          description: Label field the reason is about, when it is about one.
        params:
          type: object
          additionalProperties:
            type: string
          description: Placeholder values used by the reviewed wording.
    ExtractedLabel:
      type: object
      description: |
        Validated extraction output. Every value may be null. The NRN is
        normalized and format-checked; confusable-character variants are
        offered as candidates for registry lookup, never applied.
      properties:
        nrn:
          $ref: "#/components/schemas/StringField"
        product_name:
          $ref: "#/components/schemas/StringField"
        manufacturer:
          $ref: "#/components/schemas/StringField"
        batch_no:
          $ref: "#/components/schemas/StringField"
        mfg_date:
          $ref: "#/components/schemas/DateField"
        expiry_date:
          $ref: "#/components/schemas/DateField"
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/IngredientClaim"
        unreadable:
          type: array
          description: Field names the model or validators could not trust.
          items:
            type: string
        conflicts:
          type: array
          description: Fields where images gave different values at similar confidence.
          items:
            type: string
        provider:
          type: string
        model:
          type: string
        prompt_version:
          type: string
          example: v1
    StringField:
      type: object
      properties:
        value:
          type: string
          nullable: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: integer
          minimum: 1
          description: 1-based image position.
        raw:
          type: string
          description: Text as printed, kept even when validation rejects it.
        candidates:
          type: array
          description: NRN variants for registry lookup. Not applied automatically.
          items:
            type: string
    DateField:
      type: object
      properties:
        value:
          $ref: "#/components/schemas/LabelDate"
          nullable: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: integer
          minimum: 1
        raw:
          type: string
    LabelDate:
      type: object
      required: [year, month, precision]
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
        precision:
          type: string
          enum: [day, month]
        raw:
          type: string
    SafetyFlag:
      type: object
      required: [type, severity, reason_code, source]
      description: |
        One sourced finding. A flag reports a match against a cited document, or
        a printed value that differs from the registered record. It never says a
        medicine is safe, harmful, fake, or counterfeit.
      properties:
        type:
          type: string
          enum:
            - watchlist_product
            - watchlist_ingredient
            - undeclared_ingredient
            - missing_ingredient
            - strength_deviation
            - registration_problem
        severity:
          type: string
          enum: [high, medium, low]
          description: Feeds the phase 07 verdict engine; never a health claim.
        reason_code:
          type: string
          description: |
            Stable code. The reviewed wording catalog maps it to a sentence; a
            client must not parse free text.
          enum:
            - watchlist_alert
            - watchlist_withdrawal
            - watchlist_banned_ingredient
            - watchlist_restricted_ingredient
            - undeclared_ingredient
            - missing_ingredient
            - strength_deviation
            - registry_expired
            - registry_withdrawn
            - registry_inactive
        evidence:
          type: object
          additionalProperties:
            type: string
          description: |
            The compared values, for example `ingredient`, `label_strength`,
            `registry_strength`, and `tolerance`.
        source:
          $ref: "#/components/schemas/SafetyFlagSource"
    SafetyFlagSource:
      type: object
      required: [kind]
      description: |
        The citation for a flag: either a watchlist entry with its source
        document, or the registry record that was compared.
      properties:
        kind:
          type: string
          enum: [watchlist_entry, registry]
        watchlist_entry_id:
          type: integer
          format: int64
        issuing_body:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        issued_at:
          type: string
          format: date-time
        registry_source_id:
          type: string
        nrn:
          type: string
        status:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
    RegistryVerification:
      type: object
      required: [outcome, fields, dataset]
      description: |
        Explainable registry comparison. No outcome is a safety or authenticity
        claim; `matched_consistent` only means the printed fields agreed with
        the local record.
      properties:
        outcome:
          type: string
          enum:
            - matched_consistent
            - matched_with_mismatch
            - candidate_only
            - ambiguous
            - not_found_in_dataset
            - unreadable_input
        product:
          $ref: "#/components/schemas/RegistryProductRef"
          nullable: true
          description: Present only for the two matched outcomes.
        candidates:
          type: array
          description: |
            Up to five plausible products for `candidate_only` and `ambiguous`.
            Never choose one on the user's behalf.
          items:
            $ref: "#/components/schemas/RegistryProductRef"
        fields:
          type: object
          nullable: true
          description: |
            Per-field comparison, keyed by field name. Null when nothing could
            be compared, for example on unreadable input; treat null and an
            empty object the same way.
          additionalProperties:
            $ref: "#/components/schemas/FieldComparison"
        registry_status:
          type: string
          description: Status as stored, for example Active, Inactive, Withdrawn.
        notes:
          type: array
          items:
            $ref: "#/components/schemas/MatchNote"
        dataset:
          type: object
          required: [config_version, products]
          properties:
            config_version:
              type: string
              description: Version of the threshold file used for this result.
            products:
              type: integer
              description: Products in the local dataset when the match ran.
            last_successful_sync:
              type: string
              format: date-time
              nullable: true
              description: Null when the dataset has never been synced.
    FieldComparison:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [agree, disagree, unknown]
          description: |
            `unknown` means the printed field could not be read or compared. It
            is never counted as a disagreement.
        label:
          type: string
        registry:
          type: string
        reasons:
          type: array
          description: Stable reason codes; the UI translates them.
          items:
            type: string
    RegistryProductRef:
      type: object
      required: [source_id, name, status, score]
      properties:
        source_id:
          type: string
        nrn:
          type: string
        name:
          type: string
        manufacturer:
          type: string
        applicant:
          type: string
        status:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/IngredientClaim"
        score:
          type: number
          minimum: 0
          maximum: 1
        variant_match:
          type: boolean
          description: True when only a confusable NRN variant matched.
    MatchNote:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Stable reason code, for example strength_mismatch.
        field:
          type: string
        detail:
          type: string
    IngredientClaim:
      type: object
      properties:
        name_raw:
          type: string
        name_norm:
          type: string
        strength_raw:
          type: string
        strength:
          type: object
          additionalProperties: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: integer
    AssistantAnswer:
      type: object
      description: |
        One answered or fixed turn. `verified` is true only when the model's
        claims passed both verification passes. `fallback` is true when the fixed
        text was returned instead of a verified answer. Neither value is a
        judgement about the medicine.
      required: [conversation_id, turn, answer, sources, intent, language, verified]
      properties:
        conversation_id:
          type: string
          format: uuid
        turn:
          type: integer
          minimum: 1
        answer:
          type: string
          description: |
            Verified cited text or a fixed refusal/fallback. A claim's citations
            appear as `[1]`, `[2]`; the matching entries are in `sources`.
        sources:
          type: array
          description: |-
            Sources cited by the answer. Empty for refusals, and for the unknown
            fallback. A leaflet question answered from fixed text instead of
            passages still lists the leaflet document, so the link is never lost.
          items:
            $ref: "#/components/schemas/AssistantSource"
        disclaimer:
          type: string
          description: Fixed text shown with a verified answer.
        intent:
          type: string
          description: Closed router intent that selected the policy row.
          enum:
            - registration
            - ingredients
            - safety_flags
            - leaflet
            - indications
            - personal_safety
            - dosing
            - diagnosis
            - comparison
            - off_topic
            - prompt_injection
            - unknown
        language:
          type: string
          description: Language of the returned fixed text or answer.
        verified:
          type: boolean
          description: True only for a fully verified, cited answer.
        fallback:
          type: boolean
          description: True when a fixed fallback was returned instead of an answer.
      example:
        conversation_id: 7d5f8d7e-0f2b-4fb0-9c1a-2b6f3a1d9e42
        turn: 1
        answer: >-
          The leaflet on file says: "Keep out of reach of children." [1]
        sources:
          - id: leaflet:9
            label: "1"
            kind: leaflet
            title: Warnings
            url: https://example.test/leaflets/04-0858.pdf
            text: Keep out of reach of children.
        disclaimer: >-
          This comes from NAFDAC records and the leaflet on file. It is not
          medical advice.
        intent: leaflet
        language: en
        verified: true
        fallback: false
    AssistantSource:
      type: object
      required: [id, label, kind]
      properties:
        id:
          type: string
          description: Stable source identifier used by the verifier.
        label:
          type: string
          description: The bracketed citation number shown in `answer`.
        kind:
          type: string
          enum: [registry_record, safety_flag, leaflet, leaflet_document]
          description: |-
            `leaflet_document` is the leaflet itself rather than a passage from
            it, and carries the `url` a person can open. It is returned with a
            leaflet answer even when no passage matched, so "where can I read
            the leaflet" always has a link when NAFDAC publishes one.
        title:
          type: string
        url:
          type: string
          format: uri
        text:
          type: string
          description: The exact passage or record text the claim is checked against.
    AssistantConversation:
      type: object
      required: [conversation_id, scan_id, language, expires_at, messages]
      properties:
        conversation_id:
          type: string
          format: uuid
        scan_id:
          type: string
          format: uuid
        language:
          type: string
        expires_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            type: object
            required: [turn, role, content, created_at]
            properties:
              turn:
                type: integer
                minimum: 1
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
              intent:
                type: string
              language:
                type: string
              sources:
                type: array
                items:
                  type: string
              verifier:
                type: string
              created_at:
                type: string
                format: date-time
    Problem:
      type: object
      description: RFC 7807 problem details with a stable machine code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem type; ends with the machine code.
          example: https://medverify.ng/problems/unavailable
        title:
          type: string
          description: Short, human readable summary of the problem type.
          example: Service Unavailable
        status:
          type: integer
          description: HTTP status code, repeated in the body.
          example: 503
        detail:
          type: string
          description: |
            Human readable explanation for this occurrence. Never machine
            parsed and never contains secrets, images, or raw user text.
        instance:
          type: string
          description: Request path that produced the problem.
          example: /readyz
        code:
          type: string
          description: Stable machine code clients branch on.
          enum:
            - bad_request
            - conflict
            - corrupt_image
            - forbidden
            - image_too_large
            - insufficient_scope
            - internal_error
            - invalid_language
            - invalid_location
            - method_not_allowed
            - not_found
            - payload_too_large
            - quota_exceeded
            - rate_limited
            - timeout
            - too_many_images
            - unauthorized
            - unavailable
            - unsupported_format
      example:
        type: https://medverify.ng/problems/unavailable
        title: Service Unavailable
        status: 503
        detail: "Unavailable dependencies: storage."
        instance: /readyz
        code: unavailable

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The address that signs in. Stored lower-cased and unique.
        name:
          type: string
          maxLength: 100
          description: Optional display name. The settings page shows it back.
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          description: |-
            At least 12 characters. It is stored as a PBKDF2-HMAC-SHA256 hash
            and never logged, returned, or included in an error.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 1024

    AccountUser:
      type: object
      required: [id, email, name, client_id, created_at]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
          description: Empty when the person did not give one.
        client_id:
          type: integer
          format: int64
          description: |-
            The api_clients row this account scans as. Scans created from the
            browser and from the account's key belong to the same client.
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          description: Omitted when the account has never signed in.

    AccountSession:
      type: object
      required: [expires_at]
      description: |-
        Describes the session the response already set as a cookie. The token
        itself is never in a body, so a script cannot read it.
      properties:
        expires_at:
          type: string
          format: date-time

    APIKeyMetadata:
      type: object
      required: [prefix, scopes, state, created_at]
      properties:
        prefix:
          type: string
          description: |-
            The public half of the key, shown as `mv_<prefix>`. It identifies
            the key without authenticating anything.
          example: mv_3f9c1a2b4d5e
        scopes:
          type: array
          items:
            type: string
          example: [scans:write, scans:read, questions:write]
        state:
          type: string
          enum: [active, revoked, expired, inactive]
          description: One word derived from the key's timestamps.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          description: Omitted when the key has never been used.
        expires_at:
          type: string
          format: date-time
          description: Omitted when the key does not expire.

    IssuedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKeyMetadata"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: |-
                The full key. This is the only response that ever contains it:
                the server stores a SHA-256 hash, so it cannot be shown again.
              writeOnly: false
              example: mv_3f9c1a2b4d5e_9a1c4f8b7d2e5a0c3b6d9e2f5a8c1b4d

    RegisterResponse:
      type: object
      required: [user, session, api_key]
      properties:
        user:
          $ref: "#/components/schemas/AccountUser"
        session:
          $ref: "#/components/schemas/AccountSession"
        api_key:
          $ref: "#/components/schemas/IssuedAPIKey"

    LoginResponse:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: "#/components/schemas/AccountUser"
        session:
          $ref: "#/components/schemas/AccountSession"

    AccountResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AccountUser"

    APIKeyListResponse:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          description: Newest first. Never carries a secret.
          items:
            $ref: "#/components/schemas/APIKeyMetadata"

    RotateResponse:
      type: object
      required: [api_key, revoked]
      properties:
        api_key:
          $ref: "#/components/schemas/IssuedAPIKey"
        revoked:
          type: integer
          format: int64
          minimum: 0
          description: How many keys the rotation revoked. Zero means none was active.
