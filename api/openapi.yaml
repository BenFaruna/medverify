openapi: 3.1.0
info:
  title: MedVerify NG API
  version: 0.1.0
  description: |
    MedVerify NG checks a photographed medicine pack against NAFDAC records and
    a curated watchlist, then returns an explainable verdict.

    Phase 1 exposes operational endpoints only. Every error response uses
    RFC 7807 problem details with a stable `code` field; clients branch on
    `code`, never on `detail`.

    The API never declares a medicine safe, genuine, or authentic.
servers:
  - url: http://localhost:8080
    description: Local docker compose stack
tags:
  - name: operations
    description: Liveness and readiness probes
  - name: scans
    description: Upload pack photos asynchronously and read the result

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness
      description: |
        Reports that the process is alive. It never checks a dependency, so a
        database outage cannot cause a container restart.
      tags: [operations]
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness
      description: |
        Checks Postgres and object storage. Returns 200 only when every
        dependency responds within the readiness timeout; otherwise 503 with a
        problem detail naming the unavailable dependencies.
      tags: [operations]
      responses:
        "200":
          description: Every dependency is reachable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Cache-Control:
              description: Always `no-store`; readiness is never cached.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one dependency is unreachable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/scans:
    post:
      operationId: createScan
      summary: Upload one to four pack photos
      description: |
        Accepts a multipart upload, validates and re-encodes each image, stores
        it privately, and starts an asynchronous extraction job. When the job
        finishes within the sync wait, the response is 201. Otherwise it is 202
        with a Location header; poll GET /v1/scans/{id} until the status is
        terminal.

        Coordinates are reduced to a coarse grid cell; raw latitude and
        longitude are never stored or logged. The client filename is never used
        as a storage key.

        Send the same Idempotency-Key and identical body to retry safely. The
        same key with a different body returns 422.
      tags: [scans]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Client-generated key, up to 255 characters.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items:
                    type: string
                    format: binary
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  description: Optional, sent with longitude. Reduced to a coarse cell.
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  description: Optional, sent with latitude. Reduced to a coarse cell.
                language:
                  type: string
                  maxLength: 32
                  example: en
                  description: Optional short language tag for the extraction.
      responses:
        "201":
          description: The scan reached a terminal state within the sync wait.
          headers:
            Location:
              description: Canonical URL of the scan.
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "202":
          description: The scan is still queued or processing; poll the Location.
          headers:
            Location:
              description: URL to poll with GET.
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          description: Missing or invalid fields, too many images, or a corrupt image.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing or invalid API key.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: A file or the whole request is too large.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: A file is not JPEG, PNG, or WebP according to its bytes.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The Idempotency-Key was already used with a different body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/scans/{id}:
    get:
      operationId: getScan
      summary: Read a scan's status and result
      tags: [scans]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Scan UUID returned by the upload.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current scan state. Result fields are null until later phases fill them.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          description: The ID is not a UUID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing or invalid API key.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No scan exists with this ID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Phase 3 placeholder shared key. Phase 11 replaces it with per-client
        credentials stored in api_clients.
  headers:
    X-Request-Id:
      description: Correlation ID for this request. Echoed from the client when well formed.
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          example:
            database: ok
            storage: ok
    Scan:
      type: object
      required: [id, status, verdict, reasons, extracted, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, completed, unreadable, failed]
          description: |
            `unreadable` means the images could not be read confidently; ask
            for a better photo. It never means the medicine is fake.
        verdict:
          type: object
          nullable: true
          description: Null until phase 07. Never a safety or authenticity claim.
          additionalProperties: true
        reasons:
          type: array
          description: Empty until phase 07.
          items:
            type: object
            additionalProperties: true
        extracted:
          allOf:
            - $ref: "#/components/schemas/ExtractedLabel"
          nullable: true
          description: |
            Validated label data. Null until phase 04 fills it and on scans
            that failed before extraction. A missing field is unreadable, not a
            guess. `unreadable` and `conflicts` explain what was not trusted.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
      example:
        id: 0f9d8c2e-6a1f-4c69-9f4d-0f1f6b2c9a11
        status: completed
        verdict: null
        reasons: []
        extracted:
          nrn:
            value: "01-2345"
            confidence: 0.97
            source: 1
          product_name:
            value: "Paracetamol Tablets BP 500 mg"
            confidence: 0.96
            source: 1
          ingredients:
            - name_raw: "Paracetamol"
              name_norm: "paracetamol"
              strength_raw: "500 mg"
              strength: {raw: "500 mg", value: 500, unit: mg}
              confidence: 0.95
              source: 1
          unreadable: []
          conflicts: []
          provider: claude
          model: claude-sonnet-4-5-20250929
          prompt_version: v1
        created_at: "2026-11-02T09:00:00Z"
        completed_at: "2026-11-02T09:00:01Z"
    ExtractedLabel:
      type: object
      description: |
        Validated extraction output. Every value may be null. The NRN is
        normalized and format-checked; confusable-character variants are
        offered as candidates for registry lookup, never applied.
      properties:
        nrn:
          $ref: "#/components/schemas/StringField"
        product_name:
          $ref: "#/components/schemas/StringField"
        manufacturer:
          $ref: "#/components/schemas/StringField"
        batch_no:
          $ref: "#/components/schemas/StringField"
        mfg_date:
          $ref: "#/components/schemas/DateField"
        expiry_date:
          $ref: "#/components/schemas/DateField"
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/IngredientClaim"
        unreadable:
          type: array
          description: Field names the model or validators could not trust.
          items:
            type: string
        conflicts:
          type: array
          description: Fields where images gave different values at similar confidence.
          items:
            type: string
        provider:
          type: string
        model:
          type: string
        prompt_version:
          type: string
          example: v1
    StringField:
      type: object
      properties:
        value:
          type: string
          nullable: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: integer
          minimum: 1
          description: 1-based image position.
        raw:
          type: string
          description: Text as printed, kept even when validation rejects it.
        candidates:
          type: array
          description: NRN variants for registry lookup. Not applied automatically.
          items:
            type: string
    DateField:
      type: object
      properties:
        value:
          $ref: "#/components/schemas/LabelDate"
          nullable: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: integer
          minimum: 1
        raw:
          type: string
    LabelDate:
      type: object
      required: [year, month, precision]
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
        precision:
          type: string
          enum: [day, month]
        raw:
          type: string
    IngredientClaim:
      type: object
      properties:
        name_raw:
          type: string
        name_norm:
          type: string
        strength_raw:
          type: string
        strength:
          type: object
          additionalProperties: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: integer
    Problem:
      type: object
      description: RFC 7807 problem details with a stable machine code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem type; ends with the machine code.
          example: https://medverify.ng/problems/unavailable
        title:
          type: string
          description: Short, human readable summary of the problem type.
          example: Service Unavailable
        status:
          type: integer
          description: HTTP status code, repeated in the body.
          example: 503
        detail:
          type: string
          description: |
            Human readable explanation for this occurrence. Never machine
            parsed and never contains secrets, images, or raw user text.
        instance:
          type: string
          description: Request path that produced the problem.
          example: /readyz
        code:
          type: string
          description: Stable machine code clients branch on.
          enum:
            - bad_request
            - conflict
            - corrupt_image
            - image_too_large
            - internal_error
            - invalid_language
            - invalid_location
            - method_not_allowed
            - not_found
            - payload_too_large
            - timeout
            - too_many_images
            - unauthorized
            - unavailable
            - unsupported_format
      example:
        type: https://medverify.ng/problems/unavailable
        title: Service Unavailable
        status: 503
        detail: "Unavailable dependencies: storage."
        instance: /readyz
        code: unavailable
